spring.application.name=denunciaservice

# Puerto del servidor (Render inyecta la variable PORT)
server.port=${PORT:8080}

# ------------------------------------------------------------------
# Base de datos
#   LOCAL (por defecto): MySQL en localhost:3306/denunciadb
#   RENDER: se sobrescribe con las variables DB_URL, DB_USER y DB_PASSWORD
#
# No se fija spring.datasource.driver-class-name ni el dialecto de
# Hibernate: Spring los detecta automáticamente a partir de la URL
# (MySQL o PostgreSQL), así el mismo artefacto sirve en local y en Render.
# ------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/denunciadb?useSSL=false&allowPublicKeyRetrieval=true&connectionTimeZone=LOCAL&preserveInstants=false}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
