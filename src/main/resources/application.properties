spring.application.name=denunciaservice

# Puerto del servidor (Render inyecta la variable PORT)
server.port=${PORT:8080}

# ------------------------------------------------------------------
# Datasource - PostgreSQL (base de datos principal)
# Render inyecta las variables de entorno DB_URL, DB_USER y DB_PASSWORD;
# si no existen, se usan los valores por defecto de localhost.
# ------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/denunciadb}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ------------------------------------------------------------------
# JPA / Hibernate
# ------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

