spring.application.name=denunciaservice

# Puerto del servidor (Render inyecta la variable PORT)
server.port=${PORT:8080}

# ------------------------------------------------------------------
# Conexión MySQL LOCAL
# Si no existen las variables de entorno, se usan los valores locales.
# ------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/denunciadb?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Driver y Hibernate Dialect para MySQL
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
